name: Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # GEMINI_API_KEY is NOT needed here: the function runs on Netlify and reads it
      # from Netlify's environment variables (Site configuration → Environment variables).
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Deploy steps run only when the Netlify secrets exist. If Netlify itself
      # builds from Git (the "Import from Git" setup), leave the secrets unset and
      # this workflow acts as a test/build check only.
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Netlify secrets not set — skipping deploy (tests and build passed)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Netlify CLI
        if: steps.creds.outputs.deploy == 'true'
        run: npm install -g netlify-cli@17

      - name: Deploy to production
        if: steps.creds.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          netlify deploy --prod --dir=dist --functions=netlify/functions \
            --message "Production: ${{ github.sha }}"

      - name: Deploy draft preview (PR)
        id: preview
        if: steps.creds.outputs.deploy == 'true' && github.event_name == 'pull_request'
        run: |
          netlify deploy --dir=dist --functions=netlify/functions \
            --alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }}: ${{ github.event.pull_request.head.sha }}" \
            --json > deploy.json
          URL=$(node -p "require('./deploy.json').deploy_url")
          echo "Preview URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🔎 Preview deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.preview.outputs.url != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔎 Preview deploy ready: ${{ steps.preview.outputs.url }}`,
            });
