[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  # Model names and provider order are not secrets (they also appear in code).
  # API keys are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL,GROQ_MODEL,LLM_PROVIDERS"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
